name: venv
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # PyTorch with CUDA support
  - pytorch>=2.0.0
  - pytorch-cuda=12.1
  # Hugging Face ecosystem
  - transformers>=4.30.0
  - datasets>=2.0.0
  - accelerate>=0.20.0
  - sentence-transformers>=2.0.0
  - sentencepiece>=0.1.99
  # Data processing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - scikit-learn>=1.2.0
  - pyarrow>=10.0.0
  # NLP and text analysis
  - nltk>=3.8
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  # Statistics
  - statsmodels>=0.14.0
  # Utilities
  - tqdm>=4.65.0
  - pyyaml>=6.0
  - requests>=2.28.0
  - joblib>=1.2.0
  # pip packages (not available in conda or better via pip)
  - pip
  - pip:
    - empath>=0.89
    - rank-bm25>=0.2.2
    - textblob>=0.15.3
    - langdetect>=1.0.9
    - adjusttext>=0.7.3
    - peft>=0.4.0
    - bitsandbytes>=0.40.0
